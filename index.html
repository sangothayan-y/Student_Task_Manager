<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="header">
        
    <h1>Student Task Manager</h1>
    <p>Manage your tasks and deadlines.</p>
    <nav>
            
            <a href="#task-manager">Task Manager</a></li>
            <a href="#gpa-calculator">GPA Calculator</a></li>
            
        </nav>
    <br>
    </main>
    <h2> My Task</h2>
    <main id="task-manager">
        <div >
            <h3>Task Display</h3>
                <div id="task-list">
                    <section id="tasks">
                        <ol >
                            <li>Task 1</li>
                            <li>Task 2</li>
                            <li>Task 3</li>
                        </ol>
                    </section>
                    <section id="task-operations">
                    <label for="filter">Filter Tasks:</label>
                     <select id="filter">
                        <option value="all">All</option>
                        <option value="completed">Completed</option>
                        <option value="pending">Pending</option>
                    </select>
                    <div id="task-btn">
                    <button id="delete-task">Delete Task</button>
                    <button id="mark-completed">Mark as Completed</button>
                    <div>
                 </section>
                 </div>
        </div>
        <div>
            <h3>Add Task</h3>
            <div id="add-task">
            <section id="add-task-form">
                <label for="task">Title</label>
                <input type="text" id="task">
                <label for="due-date">Due Date</label>
                <input type="date" id="due-date">
                <label for="description">Description</label>
                <textarea id="description" placeholder="enter task decription" rows="4" ></textarea>    

                
            </section>
            <button id="add-task-btn">Add Task</button>
            </div>
        </div>

    </main>
    <br>
    <h2>GPA calculator</h2>
    <main id="gpa-calculator">
        <div id="gpa-display">
            <h3>Overall GPA</h3>
            <div id="gpa-display2">
            <p>GPA:</p>
            <input type="text" id="gpa" placeholder="0.0/4.0">
            </div>
        </div>
        <div id="gpa-input">
            <h3>Calculate GPA</h3>
            <div id="gpa-cal">
            <section id="gpa-form">
                <label for="semi">Enter your semester:</label>
                <input type="text" id="semi">
                <label for="subjects">Enter your subjects:</label>
                <input type="text" id="subjects" placeholder="Enter your subjects">
                <label for="grades">Enter your grades:</label>
                <input type="text" id="grades" placeholder="Enter your grades">
                <label for="credits">Enter subject credits:</label>
                <input type="number" id="credits" placeholder="Enter subject credits">
                <button id="add-subject">Add Subject</button>
            </section>
            <section id="gpa-operations">
                <button id="calculate-gpa">Calculate GPA</button>
                <input type="text" id="gpa-result" placeholder="GPA Result">
                <button id="save-gpa">Save</button>
                <button id="reset-gpa">Reset</button>
            </section>
            </div>
        </div>
    </main>

</body>



</html>
